<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B0D12">
  <title>A1 Lucky Spin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main id="app">

    <!-- ============ LOGIN ============ -->
    <section class="view" id="view-login" data-view="login">
      <div class="login">
        <header class="brand">
          <h1>A1 Lucky Spin</h1>
          <p>Customer lottery</p>
        </header>

        <form id="form" class="card form" novalidate autocomplete="off">
          <label class="field">
            <span>First name</span>
            <input id="first" name="first" type="text" autocomplete="given-name"
                   autocapitalize="words" enterkeyhint="next" maxlength="60">
          </label>
          <label class="field">
            <span>Last name</span>
            <input id="last" name="last" type="text" autocomplete="family-name"
                   autocapitalize="words" enterkeyhint="next" maxlength="60">
          </label>
          <label class="field">
            <span>Mobile number</span>
            <input id="phone" name="phone" type="tel" inputmode="tel"
                   autocomplete="tel" enterkeyhint="next" maxlength="16"
                   placeholder="09123456789">
          </label>
          <label class="field">
            <span>Invoice number</span>
            <input id="invoice" name="invoice" type="text" inputmode="numeric"
                   pattern="[0-9]*" enterkeyhint="go" maxlength="12">
          </label>

          <p id="error" class="error" role="alert" aria-live="assertive"></p>
          <button id="submit" class="btn" type="submit">Continue</button>
        </form>

        <p class="foot">Good luck</p>
      </div>
    </section>

    <!-- ============ WHEEL ============ -->
    <section class="view" id="view-wheel" data-view="wheel" hidden>
      <div class="wheel-layout">
        <header class="w-head">
          <h2 id="welcome">Welcome</h2>
          <p>A1 Lucky Spin</p>
        </header>

        <div class="board" id="board">
          <div class="wheel-wrap" id="wheelWrap">
            <span class="pointer" aria-hidden="true"></span>
            <canvas id="wheel" aria-label="Prize wheel" role="img"></canvas>
            <span class="hub" aria-hidden="true">A1</span>
          </div>
        </div>

        <div class="controls">
          <p id="status" class="status" aria-live="polite"></p>
          <button id="spin" class="btn" type="button">Spin!</button>
          <button id="back" class="btn ghost" type="button">Back</button>
        </div>
      </div>
    </section>

    <!-- ============ RESULT ============ -->
    <section class="view" id="view-result" data-view="result" hidden>
      <div class="result" id="result">
        <div class="hero" aria-live="polite">
          <div class="medal" aria-hidden="true">
            <span class="pointer"></span>
            <span class="rim"><span class="core">A1</span></span>
          </div>
          <h1 id="r-title">Congratulations!</h1>
          <p id="r-sub" class="lead"></p>
        </div>

        <div class="stack">
          <section class="card prize-card" aria-label="Your result">
            <p id="r-prize" class="prize"></p>
          </section>

          <section class="card ticket" aria-label="Your details">
            <dl>
              <div><dt>Name</dt><dd id="r-name">-</dd></div>
              <div><dt>Invoice</dt><dd id="r-invoice">-</dd></div>
            </dl>
          </section>

          <section class="card steps" id="r-steps" aria-labelledby="steps-title">
            <h2 id="steps-title">How to claim</h2>
            <ol>
              <li>Show this screen to the A1 team.</li>
              <li>Give them your invoice number.</li>
              <li>Collect your prize on the spot.</li>
            </ol>
          </section>

          <p id="r-note" class="card note" hidden>
            Every spin is a new memory. Thank you for being part of A1!
          </p>

          <button id="again" class="btn" type="button">Play again with a new invoice</button>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
